<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings page</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Settings.css">
</head>
<body>
  <div class="container">
    
    <header class="app-header">
      <button class="icon-btn">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>Settings</h1>
      <button class="icon-btn gear-icon">
        <img src="images/active-settings.png" alt="Settings" class="ui-icon">
      </button>
    </header>

    <main class="settings-content">
      
      <div class="profile-card">
        <div class="avatar-ring">
          <img src="images/logo.png" alt="Logo" class="avatar-img">
        </div>
        <div class="profile-info">
          <h2>KING</h2>
        </div>
        <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="section-label">Other Settings</div>

      <div class="large-background-card">
        <div class="menu-item">
          <div class="item-left">
            <img src="images/notification.png" alt="Notifications" class="ui-icon">
            <span class="item-text">Notifications</span>
          </div>
          <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <div class="menu-item">
          <div class="item-left">
            <img src="images/xp.png" alt="XP" class="ui-icon">
            <span class="item-text">XP & Gamification</span>
          </div>
          <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <div class="menu-item">
          <div class="item-left">
            <img src="images/profile.png" alt="Mentor" class="ui-icon">
            <span class="item-text">Mentor</span>
          </div>
          <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <div class="menu-item no-border">
          <div class="item-left">
            <img src="images/moon.png" alt="Appearance" class="ui-icon">
            <span class="item-text">Appearance</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="large-background-card">
        <div class="menu-item">
          <div class="item-left">
            <img src="Images/lock.png" alt="Privacy" class="ui-icon">
            <span class="item-text">Data & Privacy</span>
          </div>
          <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <div class="menu-item no-border">
          <div class="item-left">
            <img src="images/exclamation.png" alt="Privacy" class="ui-icon">
            <span class="item-text">Contact Support</span>
          </div>
          <svg class="ui-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>

        <button class="floating-chat-btn">
            <img src="images/chat.png" alt="Chat">
        </button>

           <nav class="bottom-nav">
             <a href="#" class="nav-item">
               <img src="images/home.png" alt="Home">
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/quest.png" alt="Quests">
             </a>

             <a href="#" class="nav-item">
               <img src="images/roadmap.png" alt="Map">
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/profile.png" alt="Profile">
             </a>
           </nav>

    </main>
  </div>
</body>
</html>
