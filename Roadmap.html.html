<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="Roadmap.css">
</head>
<body>
    <div class="container">
      <header>
        <section class="user-info">
            <h2 class="user-name">KING</h2>

            <span class="status-dot"></span>
          
            <button class="settings-btn">
              <img src="images/settings-icon.png" alt="Settings">
            </button>

            
        </section>   
      </header>

      <section class="roadmap-info">
        <h1 class="card-title">Roadmap</h1>
        <div class="divider-line"></div>

        <ul class="timeline">

          <li class="node-right">
            <button class="timeline-btn">Lorem Ipsum <span class="arrow">↗</span></button>
          </li>

          <li class="node-left">
            <button class="timeline-btn">Lorem Ipsum <span class="arrow">↗</span></button>
          </li>

          <li class="node-right">
            <button class="timeline-btn">Lorem Ipsum <span class="arrow">↗</span></button>
          </li>

          <li class="node-left hollow">
            <button class="timeline-btn">Lorem Ipsum <span class="arrow">↗</span></button>
          </li>

          <li class="node-bottom">
            <button class="timeline-btn">Lorem Ipsum <span class="arrow">↗</span></button>
          </li>
        </ul>
      </section>

        <button class="floating-chat-btn">
            <img src="images/chat.png" alt="Chat">
        </button>

           <nav class="bottom-nav">
             <a href="#" class="nav-item">
               <img src="images/home.png" alt="Home">
             </a>
    
             <a href="#" class="nav-item active">
               <img src="images/quest.png" alt="Quests">
               <span class="active-dot"></span>
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/roadmap.png" alt="Map">
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/profile.png" alt="Profile">
             </a>
           </nav>
    </div>
</body>
</html>
