<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <header>
        <section class="user-info">
          <h2 class="user-name">KING</h2>

          <span class="status-dot"></span>
          
          <button class="settings-btn">
          <img src="images/settings-icon.png" alt="Settings">
        </button>  
        </section>   
        
      </header>
        <section class="badge-status">
          <img src="images/badge.png" alt="Badge">
        </section>

        <div class="lvl-info">
          <h1 class="lv-status">LV. 53</h1>
          <p class="xp-status">420 / 745 XP</p>
        </div>

        <article class="priority-task">

            <div class="title-row">
                <h1 class="priority-title">Lorem Ipsum</h1>
                <button class="start-btn">Start</button>
            </div>
    
            <p class="priority-task-description">Priority task</p>

            <div class="divider-line"></div>

            <p class="priority-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

            <div class="task-stats-row">

                <div class="stat-pill">
                   <img src="images/clock.png" alt="Time" class="stat-icon">
                   <span>2hrs</span>
                </div>

                <div class="stat-pill">
                   <img src="images/crystal.png" alt="XP" class="stat-icon">
                   <span>320 XP</span>
                </div>
            </div>
        </article>

        <article class="priority-task card-challenge">
            <div class="title-row">

               <h1 class="priority-title">Lorem Ipsum</h1>
               <button class="start-btn take-on-btn">Take it on</button>
               </div>

               <p class="priority-task-description">Challenge</p>

               <div class="divider-line"></div>

               <p class="priority-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

               <div class="task-stats-row">

                  <div class="stat-pill">
                    <img src="images/clock.png" alt="Time" class="stat-icon">
                    <span>1hr</span>
                  </div>

                  <div class="stat-pill">
                    <img src="images/crystal.png" alt="XP" class="stat-icon">
                    <span>220 XP</span>
                  </div>
                </div>
        </article>

        <button class="floating-chat-btn">
            <img src="images/chat.png" alt="Chat">
        </button>

           <nav class="bottom-nav">
             <a href="#" class="nav-item">
               <img src="images/home.png" alt="Home">
             </a>
    
             <a href="#" class="nav-item active">
               <img src="images/quest.png" alt="Quests">
               <span class="active-dot"></span>
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/roadmap.png" alt="Map">
             </a>
    
             <a href="#" class="nav-item">
               <img src="images/profile.png" alt="Profile">
             </a>
            </nav>
    </div>
</body>
</html>
